# HTTP status descriptions (en-US). Key: status code.
100=The client may continue sending the request body
101=The server agreed to switch protocols
102=Request received, still processing
103=Headers sent ahead of the final response
200=Request fulfilled
201=Resource created
202=Request accepted for later processing
203=Response modified by an intermediary
204=Request fulfilled, no response body
205=The client should reset the document view
206=Only the requested range of the resource
207=Multiple statuses for independent operations
208=Members already listed in a previous response
226=Response with instance manipulations applied
300=More than one representation is available
301=Resource moved permanently
302=Resource temporarily at another address
303=Result available at another address, via GET
304=The client's cached copy is still valid
305=Deprecated: the resource must be accessed through a proxy
307=Temporary redirect keeping the method
308=Permanent redirect keeping the method
400=Malformed request
401=Missing or invalid authentication
402=Reserved for future use
403=Authenticated, but not allowed
404=Resource not found
405=Method not supported by the resource
406=No representation satisfies the Accept header
407=The proxy requires authentication
408=The client took too long to send the request
409=Conflict with the current state of the resource
410=Resource permanently removed
411=Content-Length required
412=Header precondition not met
413=Request body too large
414=URI too long
415=Unsupported body format
416=Requested range outside the resource
417=Expect header not met
418=RFC 2324 — the server is a teapot
421=Request sent to the wrong server
422=Well-formed body, but semantically invalid
423=Resource locked
424=Failed because a previous operation failed
425=The server is not ready to process yet
426=The client must switch protocols
428=The request must be conditional
429=Request limit exceeded
431=Headers too large
451=Unavailable for legal reasons
500=Internal server error
501=Feature not supported by the server
502=Invalid response from the upstream server
503=Server temporarily unavailable
504=The upstream server did not respond in time
505=HTTP version not supported
506=Content negotiation configuration error
507=Not enough storage to complete the operation
508=Infinite loop detected while processing
510=Further extensions required
511=The network requires authentication
