# HTTP status descriptions (pt-BR). Key: status code.
100=O cliente pode continuar enviando o corpo da requisição
101=O servidor aceitou trocar de protocolo
102=Requisição recebida, ainda em processamento
103=Cabeçalhos antecipados antes da resposta final
200=Requisição atendida
201=Recurso criado
202=Requisição aceita para processamento posterior
203=Resposta modificada por um intermediário
204=Requisição atendida, sem corpo de resposta
205=O cliente deve reiniciar a visão do documento
206=Apenas a faixa solicitada do recurso
207=Vários status para operações independentes
208=Membros já listados em resposta anterior
226=Resposta com manipulações de instância aplicadas
300=Há mais de uma representação disponível
301=Recurso movido de forma permanente
302=Recurso temporariamente em outro endereço
303=Resultado disponível em outro endereço, via GET
304=A cópia em cache do cliente continua válida
305=Obsoleto: o recurso deve ser acessado via proxy
307=Redirecionamento temporário mantendo o método
308=Redirecionamento permanente mantendo o método
400=Requisição malformada
401=Autenticação ausente ou inválida
402=Reservado para uso futuro
403=Autenticado, mas sem permissão
404=Recurso não encontrado
405=Método não suportado pelo recurso
406=Nenhuma representação atende ao Accept
407=O proxy exige autenticação
408=O cliente demorou demais para enviar a requisição
409=Conflito com o estado atual do recurso
410=Recurso removido de forma permanente
411=Content-Length obrigatório
412=Pré-condição dos cabeçalhos não atendida
413=Corpo da requisição grande demais
414=URI longa demais
415=Formato do corpo não suportado
416=Faixa solicitada fora do recurso
417=Cabeçalho Expect não atendido
418=RFC 2324 — o servidor é um bule
421=Requisição enviada ao servidor errado
422=Corpo bem formado, mas semanticamente inválido
423=Recurso bloqueado
424=Falhou porque uma operação anterior falhou
425=O servidor ainda não está pronto para processar
426=O cliente precisa trocar de protocolo
428=A requisição precisa ser condicional
429=Limite de requisições excedido
431=Cabeçalhos grandes demais
451=Indisponível por determinação legal
500=Erro interno do servidor
501=Funcionalidade não suportada pelo servidor
502=Resposta inválida do servidor de origem
503=Servidor temporariamente indisponível
504=O servidor de origem não respondeu a tempo
505=Versão do HTTP não suportada
506=Erro de configuração na negociação de conteúdo
507=Sem espaço para concluir a operação
508=Laço infinito detectado no processamento
510=Extensões adicionais exigidas
511=A rede exige autenticação
